<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="16" y1="12" x2="240" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="52%" stop-color="#111936"/>
      <stop offset="100%" stop-color="#090D1A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="44" y1="36" x2="212" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="glyphGrad" x1="72" y1="60" x2="188" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#glow)"/>
  <rect x="13.5" y="13.5" width="229" height="229" rx="52.5" stroke="url(#accentGrad)" stroke-opacity="0.55" stroke-width="3"/>

  <!-- Subtle Antigravity Orbit Arc -->
  <path d="M46 164C64 96 102 52 128 52C154 52 192 96 210 164" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.35" stroke-dasharray="6 10"/>

  <!-- Glass Badge Frame -->
  <rect x="48" y="48" width="160" height="160" rx="36" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Stylized '文' Glyph (Crisp Geometric Vectors) -->
  <!-- Top Dot -->
  <path d="M122 68L134 82" stroke="url(#accentGrad)" stroke-width="13" stroke-linecap="round"/>
  <!-- Horizontal Bar -->
  <path d="M72 95H184" stroke="url(#glyphGrad)" stroke-width="13" stroke-linecap="round"/>
  <!-- Right-to-Left Sweep -->
  <path d="M158 98C149 136 124 166 76 186" stroke="url(#glyphGrad)" stroke-width="13" stroke-linecap="round"/>
  <!-- Left-to-Right Sweep -->
  <path d="M96 108C112 140 138 167 180 186" stroke="url(#accentGrad)" stroke-width="13" stroke-linecap="round"/>

  <!-- Bottom Corner 'A' Pill Tag -->
  <rect x="158" y="168" width="44" height="28" rx="9" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="2"/>
  <path d="M173 190L180 174L187 190M175.2 185.5H184.8" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
